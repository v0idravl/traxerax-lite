[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traxerax-lite"
version = "0.2.0"
description = "Lightweight, self-contained Linux host defense and audit tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.3",
]

[tool.setuptools.package-data]
traxerax_lite = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
