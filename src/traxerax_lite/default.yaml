    - "/wp-login.php"
    - "/wp-admin"
    - "/wp-admin/"
    - "/wp-admin/install.php"
    - "/wp-admin/setup-config.php"
    - "/wp-config.php"
    - "/wp-config.php.bak"
    - "/wp-config.php.save"
    - "/xmlrpc.php"
    - "/.env"
    - "/.env.backup"
    - "/.env.bak"
    - "/.env.dev"
    - "/.env.example"
    - "/.env.local"
    - "/.env.old"
    - "/.env.prod"
    - "/.env.production"
    - "/.env.save"
    - "/.env.test"
    - "/.git/config"
    - "/.git/HEAD"
    - "/.git/index"
    - "/.gitlab-ci.yml"
    - "/.hg/hgrc"
    - "/.idea/workspace.xml"
    - "/.npmrc"
    - "/.ssh/authorized_keys"
    - "/.svn/entries"
    - "/.vscode/settings.json"
    - "/.well-known/security.txt"
    - "/.well-known/traffic-advice"
    - "/.well-known/change-password"
    - "/admin"
    - "/admin/"
    - "/admin.php"
    - "/administrator"
    - "/administrator/"
    - "/admin/login"
    - "/admin/login.php"
    - "/adminer"
    - "/adminer.php"
    - "/backup"
    - "/backup.zip"
    - "/backups.zip"
    - "/boaform/admin/formLogin"
    - "/cgi-bin/luci"
    - "/console"
    - "/containers/json"
    - "/debug/default/view"
    - "/docker-compose.yml"
    - "/dump.sql"
    - "/env"
    - "/etc/passwd"
    - "/hnap1"
    - "/HNAP1"
    - "/hudson/script"
    - "/jenkins/script"
    - "/login.action"
    - "/manager/html"
    - "/owa/auth/logon.aspx"
    - "/phpinfo.php"
    - "/phpmyadmin"
    - "/phpMyAdmin"
    - "/phpmyadmin/"
    - "/phpmyadmin/index.php"
    - "/pma"
    - "/portal"
    - "/remote/login"
    - "/rpc.php"
    - "/server-status"
    - "/solr/admin/info/system"
    - "/swagger-ui.html"
    - "/telescope/requests"
    - "/user/login"
    - "/vendor/.env"
    - "/vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php"
    - "/vendor/phpunit/phpunit/Util/PHP/eval-stdin.php"
    - "/web.config"
    - "/_all_dbs"
    - "/_cat/indices"
    - "/_ignition/execute-solution"
    - "/_profiler/phpinfo"
    - "/actuator"
    - "/actuator/env"
    - "/actuator/gateway/routes"
    - "/actuator/heapdump"
    - "/actuator/health"
    - "/actuator/jolokia"
    - "/actuator/logfile"
    - "/actuator/prometheus"
    - "/actuator/refresh"
    - "/actuator/routes"
    - "/actuator/threaddump"
  suspicious_path_patterns:
    - '(?:^|/)\.\.(?:/|%2f|%252f|\\)'
    - '(?:%2e%2e(?:%2f|/|%5c)|%252e%252e(?:%252f|%255c))'
    - '(?:^|[/?&;])(?:bin|usr|sbin|etc|proc|sys|dev)/(?:sh|bash|dash|zsh|busybox|passwd|shadow)\b'
    - '(?:^|[/?&;])(?:cat|curl|wget|bash|sh|chmod|chown|nc|netcat|perl|python|python3)\b'
    - '(?:;|\||`|\$\(|\${)'
    - '(?:%00|\\x00|\x00)'
    - '(?:/|^)(?:cgi-bin|\.git|\.svn|\.hg)(?:/|$)'
    - '(?:/|^)(?:backup|backups|dump|db)(?:[_\-.].*)?\.(?:zip|tar|gz|tgz|bz2|7z|sql)(?:$|[/?#])'
    - '^/[a-z][a-z0-9]{1,7}\.php(?:[?#].*)?$'

baseline:
  ignored_source_ips: []
  ignored_source_cidrs: []
  ignored_usernames: []
  ignored_nginx_paths: []
  ignored_user_agent_patterns: []

journald:
  # Master switch for --journal ingestion of security-relevant units via
  # the local journalctl binary. See config/default.yaml for details.
  enabled: true
  timeout_seconds: 30
  units:
    auth:
      - ssh
      - sshd
    fail2ban:
      - fail2ban
    nginx:
      - nginx
    mail:
      - postfix
      - dovecot

alerts:
  # Master switch for alert dispatch and review drops.
  enabled: true
  # Minimum severity that triggers terminal warnings and desktop
  # notifications: low, medium, high, or critical.
  min_severity: medium
  # Send one desktop notification per run via the local notify-send binary
  # when findings at or above min_severity are present (no network involved).
  desktop_notify: true
  # Print a styled warning banner for text-format output.
  terminal_warning: true
  # Directory where per-run JSON review drops (and latest.json) are written.
  drop_dir: data/output/drops
  # Maximum number of review drops kept; oldest are pruned first.
  max_drops: 100

daemon:
  interval_seconds: 300
  run_audit: true
  run_monitor: true
  run_integrity_scan: false
  quiet_when_clean: true
  # Delete host_state_records and kernel_events older than this many days
  # on each daemon tick; 0 disables pruning.
  retention_days: 30

changes:
  # Master switch for cross-run host state change detection. The first run
  # with an empty history establishes the baseline and produces no findings;
  # use --learn-baseline to re-baseline after intentional system changes.
  enabled: true
  # Per-category toggles.
  systemd_units: true
  cron: true
  authorized_keys: true
  shell_profiles: true
  sudoers: true
  users: true
  kernel_modules: true
  listening_ports: true
  # New listeners on these ports are not flagged.
  ignored_listen_ports: []
  # Newly-seen kernel modules with these names are not flagged.
  ignored_kernel_modules: []

audit:
  # Only the checks added after the original 11 are listed here; all other
  # audit checks use the built-in defaults (see config/default.yaml).
  rules:
    ld_preload_injection: true
    uid_zero_accounts: true
    kernel_tainted: true
    hidden_kernel_module: true
    file_capabilities: true
  severities:
    ld_preload_injection: critical
    uid_zero_accounts: high
    kernel_tainted: low
    hidden_kernel_module: high
    file_capabilities: medium

kernel:
  # Only the detector noise allowlists are listed here; all other kernel
  # telemetry options use the built-in defaults (see config/default.yaml).
  # Matching kernel events are still stored but do not produce findings.
  allowed_kernel_modules:
    - overlay
    - nf_tables
    - nft_ct
    - x_tables
    - wireguard
    - vboxguest
    - snd
  # "rootwatch-loade" is this tool's own loader (rootwatch-loader) with the
  # comm truncated to 15 chars by the kernel (TASK_COMM_LEN - 1).
  allowed_bpf_load_comms:
    - systemd
    - rootwatch-loade
    - bpftool
  allowed_cred_change_comms:
    - sudo
    - su
    - login
    - sshd
    - pkexec
    - polkitd
  # "systemd-journal" is journald's comm truncated to 15 chars.
  allowed_log_maintenance_comms:
    - logrotate
    - systemd-journal
    - rsyslogd
  allowed_ptrace_comms:
    - gdb
    - strace
    - ltrace
  allowed_setns_comms:
    - systemd
    - containerd
    - dockerd
    - podman
    - nsenter
